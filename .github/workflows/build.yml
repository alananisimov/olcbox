name: build-android-apk

# Phase 0: build an installable debug APK from this (Metro-compatible) baseline.
# Forked at upstream f3ac3da — last commit before Kotlin was bumped to the
# 2.4.0-279 dev build (#96), which the Metro compiler plugin (<=1.2.1) cannot
# compile against. Here Kotlin=2.3.21 / Metro=1.1.1 / AGP=9.2.0 are aligned.
#
# Build needs: git submodules (hev-socks5-tunnel C native via ndk-build),
# Go + gomobile (builds olcrtc.aar from OLCRTC_REPO), NDK 28.2.13676358, JDK 21.

on:
  push:
    branches: [olc]
  workflow_dispatch: {}

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: "28.2.13676358"
    steps:
      - name: Checkout olcbox
        uses: actions/checkout@v4
        with:
          path: olcbox
          submodules: recursive

      # olcRTC tunnel core: separate Go repo consumed by :sharedUI:olcrtc-bin via
      # `gomobile bind` (default ../olcrtc, overridable with OLCRTC_REPO).
      - name: Checkout olcrtc
        uses: actions/checkout@v4
        with:
          repository: alananisimov/olcrtc
          ref: master
          path: olcrtc
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: olcrtc/go.sum

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;${ANDROID_NDK_VERSION}"

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4

      - name: Install Go mobile tooling
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install github.com/magefile/mage@latest

      - name: Initialize gomobile
        working-directory: olcrtc
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          gomobile init

      - name: Build debug APK
        working-directory: olcbox
        run: |
          export OLCRTC_REPO="${{ github.workspace }}/olcrtc"
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME}"
          ./gradlew :androidApp:assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olcbox-debug-apk
          path: olcbox/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
